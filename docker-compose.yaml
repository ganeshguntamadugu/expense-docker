# version: "3"
networks:
  expense:
    name: expense
    driver: bridge
volumes:
  mysql_data:  # docker volume create mysql
    name: mysql_data
services:
  mysql:
    image: ganeshguntamadugu/mysql:v1
    container_name: mysql # --name mysql
    volumes:
    - mysql_data:/var/lib/mysql # -v mysql:/var/lib/mysql
    networks:
      - expense
  backend:
    image: ganeshguntamadugu/backend:v1
    container_name: backend
    command: sh -c "sleep 5 && node /opt/server/index.js"
    depends_on:
    - mysql
    networks:
      - expense
  frontend:
    image: ganeshguntamadugu/frontend:v1
    container_name: frontend
    ports:
    - 80:80
    depends_on:
    - backend
    networks:
      - expense