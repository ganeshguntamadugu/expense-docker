version: "3"
networks:
  expense:
volumes:
  mysql_data:  # docker volume create mysql
services:
  mysql:
    image: ganeshguntamadugu/mysql:v1
    container_name: expense_mysql # --name mysql
    volumes:
    - mysql_data:/var/lib/mysql # -v mysql:/var/lib/mysql
  backend:
    image: ganeshguntamadugu/backend:v1
    container_name: expense_backend
    command: sh -c "sleep 5 && node /opt/server/index.js"
    depends_on:
    - mysql
  frontend:
    image: ganeshguntamadugu/frontend:v1
    container_name: expense_frontend
    ports:
    - 80:80
    depends_on:
    - backend